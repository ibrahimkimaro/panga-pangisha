name: panga_pangisha
description: "Panga na Kupangisha: find, rent and manage homes in Tanzania."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0-278.1.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.5.3
  image_picker: ^1.0.7
  geolocator: ^14.0.0
  flutter_animate: ^4.5.2
  phoenix_socket: ^0.7.4
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^22.3.2
  loading_icon_button: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
